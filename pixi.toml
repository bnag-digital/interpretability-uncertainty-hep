[workspace]
authors = ["BN <bnag@purdue.edu>"]
channels = ["conda-forge"]
name = "interpretability-benchmark"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests -q"
check-data = "python scripts/00_check_data.py"
time-gnn = "python scripts/01_time_gnn.py"
train-gnn = "python scripts/02_train_gnn_seeds.py"
train = "python scripts/train.py"
explain = "python scripts/explain.py"
figures = "python scripts/make_figures.py"
collinearity = "python scripts/03_collinearity.py"

# AF GPU sessions provide CUDA 12.4. Without this block conda-forge resolves
# pytorch to its CPU-only build, and training runs on CPU with no error.
[system-requirements]
cuda = "12.4"

[dependencies]
python = "3.11.*"
pytorch-gpu = "2.5.*"
cuda-version = "12.4.*"

[pypi-dependencies]
scikit-learn = ">=1.9.0, <2"
scipy = ">=1.14, <2"
shap = ">=0.47,<0.53"
lime = ">=0.2.0.1, <0.3"
matplotlib = ">=3.11.0, <4"
mplhep = ">=0.3.55, <0.4"
numpy = ">=2.4.6, <3"
pandas = ">=3.0.3, <4"
jupyter = ">=1.1.1, <2"
h5py = ">=3.16.0, <4"
uproot = ">=5.7.4, <6"
xgboost = ">=3.2.0, <4"
hls4ml = ">=1.3.0, <2"
jupytext = ">=1.19.4, <2"
pytest = ">=8.0, <9"
